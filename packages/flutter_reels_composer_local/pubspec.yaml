name: flutter_reels_composer_local
description: Default mobile capture, gallery and preview engine.
version: 0.2.0
homepage: https://github.com/allochat/flutter_reels_composer
repository: https://github.com/allochat/flutter_reels_composer
issue_tracker: https://github.com/allochat/flutter_reels_composer/issues
license: MIT
topics: [video-editor, camera, reels, media]

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

platforms:
