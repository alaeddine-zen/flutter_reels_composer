    sdk: flutter
  flutter_reels_composer_core: ^0.2.0
  camerawesome: ^2.5.0
  photo_manager: ^3.7.1
  video_player: ^2.10.1
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  path: ^1.9.1
  permission_handler: ^12.0.1
  file_picker: ^11.0.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
